<style>
:root{--bg:#14102b;--card:#1e1840;--card2:#2a2257;--line:#3a3070;--text:#f4f0ff;--muted:#a79fd1;--accent:#ff9a3c;--accent2:#ff5e7e;--ok:#5be3a0;--warn:#ffd166;--bad:#ff6b81;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body.lock{overflow:hidden}
#app{max-width:480px;margin:0 auto;padding:14px 14px 80px}
h1,h2,h3{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-weight:800;letter-spacing:.12em;font-size:15px}
.ib{background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.hero{background:linear-gradient(160deg,#3a2a7a,#1e1840 70%);border:1px solid var(--line);border-radius:22px;padding:20px 16px;margin-bottom:12px;text-align:center}
.flame{font-size:34px}
.big{font-size:64px;font-weight:800;line-height:1;margin:2px 0}
.lbl{letter-spacing:.14em;font-size:12px;color:var(--muted);font-weight:700}
.lvl{display:inline-block;margin-top:10px;background:var(--card2);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.06em}
.bar{height:10px;background:#120d2a;border-radius:6px;overflow:hidden;margin-top:12px}
.bar.sm{height:8px;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px}
.bar i.bad{background:var(--bad)}
.sub{color:var(--muted);font-size:12px;margin-top:8px}
.st{border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid}
.st.open{background:rgba(91,227,160,.10);border-color:rgba(91,227,160,.45)}
.st.empty,.st.full,.st.jolly{background:rgba(255,209,102,.10);border-color:rgba(255,209,102,.45)}
.st.blocked,.st.breach{background:rgba(255,107,129,.10);border-color:rgba(255,107,129,.5)}
.st.gameover{background:rgba(255,60,90,.16);border-color:#ff3c5a;border-width:2px}
.tag.go{background:#ff3c5a;color:#fff}
.st.plain{background:var(--card);border-color:var(--line)}
.st.plain .bh{margin-top:0}
.st .t{font-weight:800;font-size:17px}
.st .d{color:var(--muted);margin-top:4px;font-size:13px}
.bh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:12px}
.bh b{color:var(--text)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.acts .wide{grid-column:1/3}
.btn{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;color:var(--text);background:var(--card2);cursor:pointer;width:100%}
.btn.pri{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#1a1030}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#1a1030}
.btn:disabled{opacity:.4}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
// ENGINE-START
const DAY=86400000;
function dn(s){const p=s.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/DAY);}
function ds(n){return new Date(n*DAY).toISOString().slice(0,10);}
function defaultSettings(){return{evening:3,week:4,festEvening:6,festWeek:10,fullLock:3,breachLock:7,gameOverUnits:6,gameOverLock:14,jollyPerYear:5,reviewDays:90,reviewLimit:3,zeroAfterFull:true,
 periods:[{kind:'festivo',from:'12-23',to:'01-06'},{kind:'festivo',from:'08-10',to:'08-20'},{kind:'spurgo',from:'01-07',to:'02-06'},{kind:'spurgo',from:'09-01',to:'10-01'}]};}
// periodi ricorrenti ogni anno (MM-DD). festivo: fine inclusa. spurgo: fine esclusa. Lo spurgo vince sul festivo.
function periodAt(D,st){
  const md=ds(D).slice(5);let f=null;
  for(const p of (st.periods||[])){
    const a=p.from,b=p.to;let hit;
    if(p.kind==='spurgo')hit=a<=b?(md>=a&&md<b):(md>=a||md<b);
    else hit=a<=b?(md>=a&&md<=b):(md>=a||md<=b);
    if(hit){if(p.kind==='spurgo')return 'spurgo';f='festivo';}
  }
  return f;
}
function spurgoEnd(D,st){let E=D;while(periodAt(E+1,st)==='spurgo')E++;return E;}
function weekStart(D){return D-((D+3)%7);}
const LEVELS=[
 {d:0,n:"L'INIZIO",note:"Le regole le scrivi oggi, a mente fredda. Da qui è il tuo piano a decidere la serata, non l'umore del momento."},
 {d:7,n:"IL PATTO",note:"Una settimana in regola. Ogni volta che ti fermi in tempo, dormi meglio e domani ti alleni con più testa e più gambe."},
 {d:14,n:"LA REGOLA",note:"Due settimane. Svegliarti lucido e con le gambe che rispondono non è fortuna: è la somma delle sere in cui hai scelto tu."},
 {d:28,n:"L'ABITUDINE",note:"Un mese. Meno calorie liquide, meno fame fuori controllo, un sonno più profondo. Il corpo se ne accorge prima della bilancia."},
 {d:56,n:"LA SVOLTA",note:"Otto settimane. I muscoli che costruisci in palestra restano tuoi quando non li sabotano la notte e il recupero."},
 {d:90,n:"LA VERIFICA",note:"90 giorni. Guarda i numeri: sonno, peso, passo in corsa. Se reggono, questo sistema non è una dieta, è il tuo modo di vivere."},
 {d:120,n:"IL RITMO",note:"Quattro mesi. Allenamento, sonno e moderazione remano nella stessa direzione, e si sente a ogni uscita."},
 {d:180,n:"LA MAESTRIA",note:"Sei mesi. Sai stare in una serata senza che sia lei a comandare. È l'allenamento più difficile, e lo stai vincendo."}
];
function compute(S,todayStr){
  const st=S.settings,EPS=1e-9,t=dn(todayStr),start=dn(S.start);
  const abEnd=S.abstainUntil?dn(S.abstainUntil):null;
  const jollyDays=new Set(S.jollies.map(j=>dn(j.date)));
  const allBy={},unitsBy={};
  for(const d of S.drinks){const k=dn(d.date);allBy[k]=(allBy[k]||0)+d.units;if(!jollyDays.has(k))unitsBy[k]=(unitsBy[k]||0)+d.units;}
  const winSum=D=>{let w=0;for(let k=weekStart(D);k<=D;k++)w+=unitsBy[k]||0;return w;};
  const evCapOf=D=>periodAt(D,st)==='festivo'?st.festEvening:st.evening,wkCapOf=D=>periodAt(D,st)==='festivo'?st.festWeek:st.week;
  let blk={until:-Infinity,kind:''},zero={until:-Infinity},last=null,pre=null,sub=0;
  const breaches=[],fulls=[],gameOvers=[],days={};
  for(let D=start;D<=t;D++){
    if(D===t)pre={blk:{until:blk.until,kind:blk.kind},zero:{until:zero.until}};
    const per=periodAt(D,st),evC=evCapOf(D),wkC=wkCapOf(D);
    const info={units:allBy[D]||0,jolly:jollyDays.has(D),breach:false,gameOver:false,full:false,why:[],per:per};
    const u=unitsBy[D]||0;
    if(info.jolly){ if(D+st.fullLock>blk.until)blk={until:D+st.fullLock,kind:'jolly'}; }
    else if(u>EPS){
      const why=[];
      if(per==='spurgo')why.push('spurgo');
      else{
        if(u>evC+EPS)why.push('serata');
        if(winSum(D)>wkC+EPS)why.push('settimana');
      }
      if(D<=blk.until)why.push('blocco');
      if(D<=zero.until)why.push('azzerata');
      if(abEnd!==null&&D<=abEnd)why.push('astinenza');
      if(why.length){
        info.breach=true;info.why=why;breaches.push(D);last=D;
        const go=u>=(per==='festivo'?st.festWeek:st.gameOverUnits)-EPS;
        if(go){info.gameOver=true;gameOvers.push(D);}
        const lk=go?st.gameOverLock:st.breachLock;
        if(D+lk>blk.until)blk={until:D+lk,kind:go?'gameover':'breach'};
      } else if(u>=evC-EPS){
        info.full=true;fulls.push(D);
        if(D+st.fullLock>blk.until)blk={until:D+st.fullLock,kind:'full'};
        if(st.zeroAfterFull)zero={until:weekStart(D)+6};
      } else sub++;
    }
    days[D]=info;
  }
  const base=last!==null?last:start;
  const calDays=t>=start?t-base:0;
  const soberToday=t>=start&&(S.sober||[]).some(x=>dn(x)===t)&&!(days[t]&&days[t].breach);
  const daysN=calDays+(soberToday?1:0);
  const pts=[start].concat(breaches,[t]);
  let best=0;if(t>=start){for(let i=1;i<pts.length;i++)best=Math.max(best,pts[i]-pts[i-1]);}
  if(soberToday)best=Math.max(best,daysN);
  let lvlIdx=0;for(let i=0;i<LEVELS.length;i++)if(daysN>=LEVELS[i].d)lvlIdx=i;
  const todayUnits=unitsBy[t]||0,win=t>=start?winSum(t):0;
  const perT=periodAt(t,st),evCap=evCapOf(t),wkCap=wkCapOf(t);
  const budgetLeft=Math.max(0,wkCap-win);
  const eveningLeft=perT==='spurgo'?0:Math.max(0,Math.min(evCap-todayUnits,budgetLeft));
  const ti=days[t]||{units:0,jolly:false,breach:false,full:false,why:[]};
  let blockedToday=null;
  if(pre){
    const c=[];
    if(t<=pre.blk.until)c.push({until:pre.blk.until,kind:pre.blk.kind});
    if(t<=pre.zero.until)c.push({until:pre.zero.until,kind:'zero'});
    if(abEnd!==null&&t<=abEnd)c.push({until:abEnd,kind:'abstain'});
    if(perT==='spurgo')c.push({until:spurgoEnd(t,st),kind:'spurgo'});
    if(c.length)blockedToday=c.reduce((a,b)=>b.until>a.until?b:a);
  }
  let nextFree=null;
  for(let X=t+1;X<=t+90;X++){
    if(X<=blk.until||X<=zero.until||(abEnd!==null&&X<=abEnd)||periodAt(X,st)==='spurgo')continue;
    let w=0;for(let k=weekStart(X);k<=t;k++)w+=unitsBy[k]||0;
    if(wkCapOf(X)-w>=1-EPS){nextFree=X;break;}
  }
  let kind='open';
  if(t<start)kind='notstarted';
  else if(ti.breach)kind=ti.gameOver?'gameover':'breach';
  else if(ti.jolly)kind='jolly';
  else if(blockedToday)kind='blocked';
  else if(ti.full)kind='full';
  else if(eveningLeft<=EPS)kind='empty';
  const vStart=(abEnd!==null&&abEnd+1>start)?abEnd+1:start,vEnd=vStart+st.reviewDays;
  let rU=0,rB=0,rJ=0,rS=0,rD=0;const rEnd=Math.min(t,vEnd-1);
  for(let D=vStart;D<=rEnd;D++){if((allBy[D]||0)>EPS)rD++;rU+=unitsBy[D]||0;if(days[D]&&days[D].breach)rB++;if(jollyDays.has(D))rJ++;}
  (S.sober||[]).forEach(s=>{const k=dn(s);if(k>=vStart&&k<=rEnd)rS++;});
  const rDays=Math.max(0,rEnd-vStart+1);
  const jollyUsed=S.jollies.filter(j=>dn(j.date)>t-365).length;
  return{days,breaches,gameOvers,fulls,daysN,calDays,weeks:Math.floor(daysN/7),best,lvlIdx,todayUnits,win,budgetLeft,eveningLeft,per:perT,evCap,wkCap,kind,blockedToday,blk,zero,abEnd,nextFree,sub,
    jollyLeft:Math.max(0,st.jollyPerYear-jollyUsed),
    review:{vStart,vEnd,rDays,drinkDays:rD,units:rU,avgWeek:rDays>0?rU/(rDays/7):0,breaches:rB,jollies:rJ,sober:rS,
      progress:Math.max(0,Math.min(1,(t-vStart)/st.reviewDays)),started:t>=vStart,done:t>=vEnd,dayNo:Math.max(0,t-vStart+1)}};
}
// ENGINE-END

// ---------- UI ----------
const KEY='mindsetQuest_v2';
const PRESETS=[
 {id:'bn',icon:'🍺',name:'Birra normale 33 cl',u:1},
 {id:'ba',icon:'🍻',name:'Birra artigianale',u:2},
 {id:'vi',icon:'🍷',name:'Calice di vino',u:1},
 {id:'dr',icon:'🍹',name:'Drink (americano, spritz, gin tonic)',u:1.5},
 {id:'sh',icon:'🥃',name:'Shot / amaro',u:1}
];
const LBL=['Inizio','1 Settimana','2 Settimane','1 Mese','2 Mesi','3 Mesi','4 Mesi','6 Mesi'];
let selLvl=null,mapKeep=null;
const JTYPES=['Settimana Pesante! (A lavoro)','Settimana Pesante! (Scelte di vita sbagliate)','Libero!','Evento Speciale!','Socialità Forzata!'];
const LOGDAYS=7;
const WHY={serata:'più unità del tetto per serata',settimana:'più unità del tetto settimanale',blocco:'sei in un periodo di blocco',azzerata:'la settimana era già chiusa',astinenza:'sei nel periodo senza alcol',spurgo:'è un periodo di spurgo totale'};
const $=s=>document.querySelector(s);
const app=$('#app');
let S=load();
let draft=null,jdraft=null,confirmResolve=null;

function load(){try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r));}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function migrate(o){
  if(!o||!o.start)return null;
  o.settings=Object.assign(defaultSettings(),o.settings||{});
  o.checkins=o.checkins||[];o.drinks=o.drinks||[];o.jollies=o.jollies||[];if(!Array.isArray(o.settings.periods))o.settings.periods=defaultSettings().periods;o.settings.periods.forEach(q=>{if(q.kind==='spurgo'&&q.from==='01-06')q.from='01-07';});o.sober=o.sober||[];o.rewards=o.rewards||{};
  o.abstainUntil=o.abstainUntil||'';o.seenLevel=o.seenLevel||0;
  return o;
}
function todayStr(){const d=new Date();d.setHours(d.getHours()-4);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const WD=['dom','lun','mar','mer','gio','ven','sab'];
function fmtDate(s){const n=typeof s==='number'?s:dn(s);const d=new Date(n*DAY);return WD[d.getUTCDay()]+' '+String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');}
function fmtU(x){return(Math.round(x*10)/10).toLocaleString('it-IT');}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2800);}
function clone(o){return JSON.parse(JSON.stringify(o));}

function openModal(html){$('#modal').innerHTML='<div class="ov" data-action="closeModal"></div><div class="sheet">'+html+'</div>';document.body.classList.add('lock');}
let goResolve=null;
function closeModal(){$('#modal').innerHTML='';document.body.classList.remove('lock');if(confirmResolve){const r=confirmResolve;confirmResolve=null;r(false);}if(goResolve){const r=goResolve;goResolve=null;r('no');}if(jtResolve){const r=jtResolve;jtResolve=null;r(null);}}
function askGameOver(why,left){
  return new Promise(res=>{
    openModal('<div class="center"><div style="font-size:48px">💀</div><h3>GAME OVER?</h3><p class="muted">Motivo: '+why+'.<br><br>Il contatore va a 0, i livelli si rifanno da capo e scatta un blocco di '+S.settings.gameOverLock+' giorni.'+(left>0?'<br><br>Se è un\'occasione speciale usa un jolly: la serata non conta.':'')+'</p>'
      +'<div class="row" style="flex-direction:column">'+(left>0?'<button class="btn pri" data-action="goJolly">🎟️ Usa un jolly ('+left+' rimasti)</button>':'')+'<button class="btn danger" data-action="goYes">Registra GAME OVER</button><button class="btn ghost" data-action="goNo">Annulla</button></div></div>');
    goResolve=res;
  });
}
function goAnswer(v){const r=goResolve;goResolve=null;$('#modal').innerHTML='';document.body.classList.remove('lock');if(r)r(v);}
let jtResolve=null;
function jollyTally(){const t=dn(todayStr()),m={};JTYPES.forEach(x=>m[x]=0);S.jollies.filter(j=>dn(j.date)>t-365).forEach(j=>{if(j.type in m)m[j.type]++;});return m;}
function askJollyType(){
  return new Promise(res=>{
    const m=jollyTally();
    openModal('<h3>Che jolly è?</h3><p class="muted small">Scegli il tipo: il totale resta di '+S.settings.jollyPerYear+' all\'anno.</p><div class="row" style="flex-direction:column">'
      +JTYPES.map((x,i)=>'<button class="btn" data-action="jtPick" data-i="'+i+'">'+x+(m[x]?' · usato '+m[x]+'×':'')+'</button>').join('')+'<button class="btn ghost" data-action="closeModal">Annulla</button></div>');
    jtResolve=res;
  });
}
function askConfirm(title,text,ok,danger){
  return new Promise(res=>{
    openModal('<h3>'+title+'</h3><p class="muted">'+text+'</p><div class="row"><button class="btn ghost" data-action="cfNo">Annulla</button><button class="btn '+(danger?'danger':'pri')+'" data-action="cfYes">'+ok+'</button></div>');
    confirmResolve=res;
  });
}

// ---------- onboarding ----------
function renderOnboarding(){

function saveCheckin(){
  const wk=ds(weekStart(dn(todayStr())));

  const c={week:wk,peso:g('c_peso'),sonno:g('c_sonno'),energia:Math.round(g('c_en'))};
  if(c.energia&&(c.energia<1||c.energia>5)){toast('Energia da 1 a 5');return;}
  if(c.sonno&&(c.sonno<2||c.sonno>14)){toast('Sonno non valido');return;}
  if(c.peso&&(c.peso<30||c.peso>250)){toast('Peso non valido');return;}
  if(!c.peso&&!c.sonno&&!c.energia){toast('Inserisci almeno un valore');return;}
  S.checkins=S.checkins.filter(x=>x.week!==wk);S.checkins.push(c);S.checkins.sort((a,b)=>a.week<b.week?-1:1);

function badgesDef(C){
  const t=dn(todayStr()),so=S.sober.length;
  const sd=S.sober.map(dn).sort((x,y)=>x-y);
  const wk=sd.filter(k=>{const g=new Date(k*DAY).getUTCDay();return g===5||g===6;}).length;
  let bw=0;for(let i=0;i<sd.length;i++){let c=0;for(let j=i;j<sd.length&&sd[j]<sd[i]+7;j++)c++;bw=Math.max(bw,c);}
  const pts=C.breaches.slice().sort((x,y)=>x-y);let rise=0;
  pts.forEach((x,i)=>{const end=i+1<pts.length?pts[i+1]:t;rise=Math.max(rise,Math.min(7,end-x));});
  const lj=S.jollies.reduce((m,j)=>Math.max(m,dn(j.date)),dn(S.start));
  const free=Math.max(0,t-lj);
  const R=C.review,rd=S.settings.reviewDays,vd=R.started?Math.min(rd,R.dayNo):0;
  const mk=(ic,n,d,cur,max)=>({ic:ic,n:n,d:d,cur:Math.min(cur,max),max:max,ok:cur>=max});
  const arr=[
   mk('✨','Scintilla','1 spurgo',so,1),
   mk('🔥','Fiamma','5 spurgo',so,5),
   mk('🪵','Falò','10 spurgo',so,10),
   mk('☄️','Incendio','25 spurgo',so,25),
   mk('🌋','Vulcano','50 spurgo',so,50),
   mk('👑','Leggenda','100 spurgo',so,100),
   mk('🌃','Weekend sobrio','1 spurgo di venerdì o sabato',wk,1),
   mk('🌠','Weekend da campione','5 spurgo di venerdì o sabato',wk,5),
   mk('📅','Settimana piena','5 spurgo in 7 giorni',bw,5),
   mk('💪','Rialzata','7 giorni in regola dopo uno sforamento',rise,7),
   mk('🃏','Jolly in tasca','90 giorni senza usare un jolly',free,90),
   mk('🧪','Verifica completata',rd+' giorni',vd,rd)
  ];
  const last=arr[arr.length-1];last.ok=R.done;if(R.done)last.cur=last.max;
  return arr;
}

   +'<p class="muted small center">App di supporto personale: non sostituisce il parere del medico.</p>';
  const m=document.getElementById('map');
  if(m){if(mapKeep!==null)m.scrollLeft=mapKeep;else{const n=m.querySelector('.node.cur');if(n)m.scrollLeft=n.offsetLeft-m.clientWidth/2+n.offsetWidth/2;}}
  levelCheck(C);
}
function levelCheck(C){
  if(C.lvlIdx>S.seenLevel){
    S.seenLevel=C.lvlIdx;save();
    const L=LEVELS[C.lvlIdx],rw=S.rewards[C.lvlIdx];
    openModal('<div class="center"><div style="font-size:48px">🎉</div><h3>LIVELLO '+C.lvlIdx+' SBLOCCATO</h3><p><b>'+L.n+'</b></p><p class="muted">'+L.note+'</p>'+(rw?'<div class="st jolly"><div class="t">🎁 Il tuo premio</div><div class="d">'+esc(rw)+'</div></div>':'<p class="muted small">Puoi scegliere il premio di ogni livello nelle impostazioni.</p>')+'<button class="btn pri" data-action="closeModal">Avanti</button></div>');
  }
}

// ---------- add drink ----------
function newDraft(){return{preset:'bn',qty:1,date:todayStr(),note:''};}
function num(v){return parseFloat(String(v).replace(',','.'));}
function draftUnits(){const p=PRESETS.find(x=>x.id===draft.preset);return p?p.u*draft.qty:0;}
function addModal(){
  const t=todayStr();
  let body='<div class="pg">'+PRESETS.map(p=>'<button class="pp '+(draft.preset===p.id?'on':'')+'" data-action="pickPreset" data-id="'+p.id+'"><b>'+p.icon+' '+fmtU(p.u)+' u</b>'+p.name+'</button>').join('')+'</div>';
  body+='<label>Quantità</label><div class="qty"><button data-action="qtyMinus">−</button><b>'+draft.qty+'</b><button data-action="qtyPlus">+</button></div>';
  body+='<label>Giorno</label><input type="date" id="f_date" data-f="date" value="'+draft.date+'" min="'+S.start+'" max="'+t+'">';
  body+='<label>Contesto o cosa l\'ha scatenata (facoltativo)</label><input id="f_note" data-f="note" placeholder="es. cena con amici, stress, noia" value="'+esc(draft.note)+'">';
  body+='<div class="tot"><span>Totale</span><span id="f_tot">'+fmtU(draftUnits())+' unità</span></div>';
  body+='<div class="row"><button class="btn ghost" data-action="closeModal">Annulla</button><button class="btn pri" data-action="saveDrink">Registra</button></div>';
  openModal('<h3>Registra una bevuta</h3>'+body);
}
async function saveDrink(){
  const u=draftUnits();
  if(u<=0){toast('Scegli cosa hai bevuto');return;}
  if(!draft.date||draft.date<S.start||draft.date>todayStr()){toast('Giorno non valido');return;}
  const pr=PRESETS.find(x=>x.id===draft.preset),name=(draft.qty>1?draft.qty+'× ':'')+pr.name,icon=pr.icon;
  const entry={id:uid(),date:draft.date,name:name,icon:icon,qty:draft.qty,units:Math.round(u*100)/100,note:draft.note.trim()};
  const T=todayStr(),before=compute(S,T),S2=clone(S);S2.drinks.push(entry);const after=compute(S2,T),k=dn(entry.date);
  const newBreach=after.breaches.includes(k)&&!before.breaches.includes(k);
  const newFull=after.fulls.includes(k)&&!before.fulls.includes(k);
  const newGO=!!(after.days[k]&&after.days[k].gameOver)&&!(before.days[k]&&before.days[k].gameOver);
  if(newGO){
    const why=(after.days[k].why||[]).map(w=>WHY[w]).join(', ')||('almeno '+S.settings.gameOverUnits+' unità in una serata');
    const ch=await askGameOver(why,periodAt(k,S.settings)==='spurgo'?0:before.jollyLeft);
    if(ch==='no'||!ch)return;
    if(ch==='jolly'){
      const ty=await askJollyType();if(!ty)return;
      if(!S.jollies.some(j=>j.date===entry.date))S.jollies.push({id:uid(),date:entry.date,type:ty,reason:ty});
      S.drinks.push(entry);save();closeModal();render();toast('Jolly usato: la serata non conta 🎟️');return;
    }
    S.seenLevel=0;S.drinks.push(entry);save();closeModal();render();toast('GAME OVER. Si ricomincia 💀');return;
  }
  if(newBreach){
    const why=(after.days[k].why||[]).map(w=>WHY[w]).join(', ');
    const ok=await askConfirm('⚠️ Questo è uno sforamento','Motivo: '+why+'.<br><br>Il Mindset torna a 0 e scatta un blocco di '+S.settings.breachLock+' giorni.','Registra comunque',false);
    if(!ok)return;
  } else if(newFull){
    const ok=await askConfirm('🟠 Serata piena','Con questa arrivi a '+S.settings.evening+' unità: '+(S.settings.zeroAfterFull?'la settimana si chiude e ':'')+'scatta un blocco di '+S.settings.fullLock+' giorni (fino a '+fmtDate(after.blk.until)+').','Registra',false);
    if(!ok)return;
  }
  S.drinks.push(entry);save();closeModal();render();
  toast(newBreach?'Registrato. Si riparte da qui.':'Registrato ✓');
}

// ---------- jolly ----------
function jollyModal(){
  const C=compute(S,todayStr());
  if(C.jollyLeft<=0){toast('Hai finito i jolly di quest\'anno');return;}
  const t=todayStr(),min=ds(Math.max(dn(S.start),dn(t)-14));
  if(periodAt(dn(t),S.settings)==='spurgo'){toast('Durante lo spurgo totale non ci sono jolly');return;}
  const tal=jollyTally();
  jdraft={date:t,reason:JTYPES[3],free:''};
  openModal('<h3>Usa un jolly</h3><p class="muted small">Te ne restano '+C.jollyLeft+' su '+S.settings.jollyPerYear+' (ultimi 12 mesi). Il giorno è libero dal conteggio, non dalla sicurezza: niente guida, niente prima di un allenamento chiave. Dopo scattano '+S.settings.fullLock+' giorni a zero. Il Mindset non si azzera.</p>'
   +'<label>Giorno</label><input type="date" id="j_date" data-j="date" value="'+t+'" min="'+min+'" max="'+t+'">'
   +'<label>Tipo di jolly</label><div class="chips">'+JTYPES.map(r=>'<button class="'+(r===jdraft.reason?'on':'')+'" data-action="pickReason" data-r="'+esc(r)+'">'+r+(tal[r]?' · '+tal[r]+'×':'')+'</button>').join('')+'</div>'
   +'<label>Dettaglio (facoltativo)</label><input data-j="free" placeholder="es. cena con i colleghi">'
   +'<div class="row"><button class="btn ghost" data-action="closeModal">Annulla</button><button class="btn pri" data-action="saveJolly">Usa il jolly</button></div>');
}
function saveJolly(){
  if(!jdraft.date||jdraft.date<S.start||jdraft.date>todayStr()){toast('Giorno non valido');return;}
  if(S.jollies.some(j=>j.date===jdraft.date)){toast('Quel giorno ha già un jolly');return;}
  if(periodAt(dn(jdraft.date),S.settings)==='spurgo'){toast('Durante lo spurgo totale non ci sono jolly');return;}
  const reason=jdraft.reason+(jdraft.free.trim()?' · '+jdraft.free.trim():'');
  S.jollies.push({id:uid(),date:jdraft.date,type:jdraft.reason,reason:reason});
  save();closeModal();render();toast('Jolly usato 🃏');
}

// ---------- settings ----------
function fmtMD(x){const a=x.split('-');return a[1]+'/'+a[0];}
function parseMD(x){const m=/^\s*(\d{1,2})\s*[\/.-]\s*(\d{1,2})\s*$/.exec(x||'');if(!m)return null;const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return null;return String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function settingsModal(){
  const st=S.settings;
  const f=(id,label,v,step)=>'<div><label>'+label+'</label><input type="number" id="'+id+'" inputmode="decimal" step="'+(step||1)+'" value="'+v+'"></div>';
  openModal('<h3>⚙️ Impostazioni</h3>'
   +'<label>Inizio percorso</label><input type="date" id="s_start" value="'+S.start+'" max="'+todayStr()+'">'
   +'<label>Periodo senza alcol fino al</label><input type="date" id="s_abs" value="'+S.abstainUntil+'">'
   +'<div class="sec">LIMITI</div><div class="g2">'
   +f('s_evening','Unità max a serata',st.evening,0.5)+f('s_week','Unità max a settimana',st.week,0.5)
   +f('s_festEv','Unità a serata (festivo)',st.festEvening,0.5)+f('s_festWk','Unità a settimana (festivo)',st.festWeek,0.5)+f('s_fullLock','Giorni di blocco (serata piena)',st.fullLock)
   +f('s_breachLock','Giorni di blocco (sforamento)',st.breachLock)+f('s_jolly','Jolly all\'anno',st.jollyPerYear)
   +f('s_go','Unità per il game over',st.gameOverUnits,0.5)+f('s_goLock','Giorni di blocco (game over)',st.gameOverLock)
   +f('s_rev','Giorni di verifica',st.reviewDays)+f('s_revLim','Sforamenti per allarme',st.reviewLimit)
   +'</div><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="s_zero" '+(st.zeroAfterFull?'checked':'')+'> Serata piena = settimana chiusa</label>'
   +'<div class="sec">📅 PERIODI (ogni anno, gg/mm)</div>'
   +st.periods.map((q,i)=>'<div class="g2"><div><label>'+(q.kind==='spurgo'?'🌿 Spurgo totale · dal':'🎉 Festivo · dal')+'</label><input id="p_f'+i+'" value="'+fmtMD(q.from)+'" placeholder="gg/mm"></div><div><label>'+(q.kind==='spurgo'?'al (escluso)':'al (incluso)')+'</label><input id="p_t'+i+'" value="'+fmtMD(q.to)+'" placeholder="gg/mm"></div></div>').join('')
   +'<div class="sec">🎁 PREMI PER LIVELLO</div>'
   +LEVELS.map((L,i)=>i===0?'':'<label>LIV. '+i+' · '+L.n+' ('+L.d+' gg)</label><input id="r_'+i+'" placeholder="Il premio che ti dai" value="'+esc(S.rewards[i]||'')+'">').join('')
   +'<div class="row"><button class="btn ghost" data-action="closeModal">Chiudi</button><button class="btn pri" data-action="saveSettings">Salva</button></div>'
   +'<div class="sec">DATI</div><div class="g2"><button class="btn" data-action="exportData">Esporta</button><button class="btn" data-action="importData">Importa</button></div>'
   +'<input type="file" id="imp" accept=".json,application/json" style="display:none">'
   +'<div class="row"><button class="btn danger" data-action="resetAll">Cancella tutto e ricomincia</button></div>');
  $('#imp').addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=async()=>{try{const o=migrate(JSON.parse(r.result));if(!o)throw 0;const ok=await askConfirm('Importare i dati?','I dati attuali verranno sostituiti.','Importa',true);if(!ok)return;S=o;save();closeModal();render();toast('Dati importati');}catch(err){toast('File non valido');}};
    r.readAsText(file);
  });
}
function saveSettings(){
  const g=id=>num($('#'+id).value);
  const v={evening:g('s_evening'),week:g('s_week'),festEvening:g('s_festEv'),festWeek:g('s_festWk'),fullLock:g('s_fullLock'),breachLock:g('s_breachLock'),gameOverUnits:g('s_go'),gameOverLock:g('s_goLock'),jollyPerYear:g('s_jolly'),reviewDays:g('s_rev'),reviewLimit:g('s_revLim')};
  for(const k in v){if(!(v[k]>=0)||isNaN(v[k])){toast('Controlla i valori numerici');return;}}
  if(v.evening<=0||v.week<=0||v.festEvening<=0||v.festWeek<=0||v.reviewDays<1){toast('Valori non validi');return;}
  const np=[];
  for(let i=0;i<S.settings.periods.length;i++){const a=parseMD($('#p_f'+i).value),b=parseMD($('#p_t'+i).value);if(!a||!b){toast('Date dei periodi non valide (gg/mm)');return;}np.push({kind:S.settings.periods[i].kind,from:a,to:b});}
  const start=$('#s_start').value||S.start;
  if(start>todayStr()){toast('L\'inizio non può essere nel futuro');return;}
  Object.assign(S.settings,v);S.settings.periods=np;S.settings.zeroAfterFull=$('#s_zero').checked;
  S.start=start;S.abstainUntil=$('#s_abs').value||'';
  LEVELS.forEach((L,i)=>{const el=$('#r_'+i);if(!el)return;const val=el.value.trim();if(val)S.rewards[i]=val;else delete S.rewards[i];});
  save();closeModal();render();toast('Salvato ✓');
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mindset-quest-backup.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

// ---------- events ----------
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action;
  switch(a){
   case 'startApp':startApp();break;
   case 'selLvl':selLvl=+el.dataset.i;render();break;
   case 'closeModal':closeModal();break;
   case 'cfYes':{const r=confirmResolve;confirmResolve=null;$('#modal').innerHTML='';document.body.classList.remove('lock');if(r)r(true);break;}
   case 'cfNo':closeModal();break;
   case 'goJolly':goAnswer('jolly');break;
   case 'goYes':goAnswer('go');break;
   case 'goNo':closeModal();break;
   case 'jtPick':{const r=jtResolve;jtResolve=null;$('#modal').innerHTML='';document.body.classList.remove('lock');if(r)r(JTYPES[+el.dataset.i]);break;}
   case 'openAdd':if(S.sober.includes(todayStr())){toast('Oggi hai fatto spurgo: annullalo se vuoi registrare');break;}draft=newDraft();addModal();break;
   case 'pickPreset':draft.preset=el.dataset.id;addModal();break;
   case 'qtyPlus':draft.qty=Math.min(10,draft.qty+1);addModal();break;
   case 'qtyMinus':draft.qty=Math.max(1,draft.qty-1);addModal();break;
   case 'saveDrink':saveDrink();break;
   case 'openJolly':if(S.sober.includes(todayStr())){toast('Oggi hai fatto spurgo: annullalo se vuoi usare un jolly');break;}jollyModal();break;
   case 'pickReason':jdraft.reason=el.dataset.r;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
   case 'saveJolly':saveJolly();break;
   case 'openSettings':settingsModal();break;
   case 'openCheckin':checkinModal();break;
   case 'saveCheckin':saveCheckin();break;
   case 'saveSettings':saveSettings();break;
   case 'exportData':exportData();break;
   case 'importData':$('#imp').click();break;
   case 'resetAll':{const ok=await askConfirm('Cancellare tutto?','Registro, jolly e premi verranno eliminati. Non si può annullare.','Cancella',true);if(ok){S=null;try{localStorage.removeItem(KEY);}catch(x){}render();}break;}
   case 'sober':{
     const t=todayStr();
     if(S.sober.includes(t)){toast('Già segnata per oggi');break;}
     if(S.drinks.some(d=>d.date===t)){toast('Oggi hai già registrato delle bevute');break;}
     S.sober.push(t);save();render();toast('Giorno '+compute(S,todayStr()).daysN+' in regola 🔥');break;}
   case 'delDrink':{const ok=await askConfirm('Eliminare la bevuta?','Il conteggio verrà ricalcolato.','Elimina',true);if(ok){S.drinks=S.drinks.filter(d=>d.id!==el.dataset.id);save();render();}break;}
   case 'delJolly':{const ok=await askConfirm('Annullare il jolly?','Il jolly torna disponibile e il giorno viene ricalcolato con le regole normali.','Annulla jolly',true);if(ok){S.jollies=S.jollies.filter(j=>j.id!==el.dataset.id);save();render();}break;}
   case 'delSober':{S.sober=S.sober.filter(d=>d!==el.dataset.date);save();render();break;}
  }
});
document.addEventListener('input',e=>{
  const f=e.target.dataset;
  if(f.f&&draft){draft[f.f]=e.target.value;}
  if(f.j&&jdraft)jdraft[f.j]=e.target.value;
});
render();
</script>
